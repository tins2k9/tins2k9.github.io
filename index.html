<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        :root {
            --maunen: #050505;
            --mauchu: #ff003c;
            --mauchinh: #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: var(--maunen);
            color: var(--mauchinh);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .hieuungnhieu {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            text-align: center;
            padding: 0 20px;
            text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.025em -0.05em 0 rgba(0,255,0,0.75), 0.025em 0.05em 0 rgba(0,0,255,0.75);
            animation: chongmat 500ms infinite;
        }
        @keyframes chongmat {
            0% { text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.025em -0.05em 0 rgba(0,255,0,0.75), 0.025em 0.05em 0 rgba(0,0,255,0.75); }
            14% { text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.025em -0.05em 0 rgba(0,255,0,0.75), 0.025em 0.05em 0 rgba(0,0,255,0.75); }
            15% { text-shadow: -0.05em -0.025em 0 rgba(255,0,0,0.75), 0.025em 0.025em 0 rgba(0,255,0,0.75), -0.05em -0.05em 0 rgba(0,0,255,0.75); }
            49% { text-shadow: -0.05em -0.025em 0 rgba(255,0,0,0.75), 0.025em 0.025em 0 rgba(0,255,0,0.75), -0.05em -0.05em 0 rgba(0,0,255,0.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255,0,0,0.75), 0.05em 0 0 rgba(0,255,0,0.75), 0 -0.05em 0 rgba(0,0,255,0.75); }
            99% { text-shadow: 0.025em 0.05em 0 rgba(255,0,0,0.75), 0.05em 0 0 rgba(0,255,0,0.75), 0 -0.05em 0 rgba(0,0,255,0.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255,0,0,0.75), -0.025em -0.025em 0 rgba(0,255,0,0.75), -0.025em -0.05em 0 rgba(0,0,255,0.75); }
        }
        .bantruot {
            position: absolute;
            bottom: 20px;
            font-size: 0.85rem;
            color: #444;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="hieuungnhieu">có con cak gì ở đây mà soi ?</div>
    <div class="bantruot">© 2026 | VietNam</div>

    <script>
        const vohieuhoapham = function() {
            document.addEventListener("contextmenu", function(sukienchuot) {
                sukienchuot.preventDefault();
            }, false);

            document.addEventListener("keydown", function(sukienbanphim) {
                const tohopkhoa = sukienbanphim.ctrlKey && sukienbanphim.shiftKey;
                const phimfmuoihai = sukienbanphim.keyCode === 123;
                const phimnguon = sukienbanphim.ctrlKey && sukienbanphim.keyCode === 85;
                const phimkiemtra = tohopkhoa && (sukienbanphim.keyCode === 73 || sukienbanphim.keyCode === 74 || sukienbanphim.keyCode === 67);
                const phimsaochap = sukienbanphim.ctrlKey && sukienbanphim.keyCode === 67;

                if (phimfmuoihai || phimnguon || phimkiemtra || phimsaochap) {
                    sukienbanphim.preventDefault();
                    sukienbanphim.stopPropagation();
                }
            }, false);
        };

        const baykiemtraloi = function() {
            const vonglapvotan = function() {
                let thoigianbatdau = new Date().getTime();
                debugger;
                let thoigianketthuc = new Date().getTime();
                
                if (thoigianketthuc - thoigianbatdau > 50) {
                    document.body.innerHTML = "<div style='color:red;font-size:5rem;text-align:center;margin-top:20vh;font-weight:bold;'>BỊ BẮT QUẢ TANG</div>";
                    window.location.replace("about:blank");
                }
            };
            setInterval(vonglapvotan, 50);
        };

        const xoadulieubangdieukhien = function() {
            setInterval(function() {
                console.clear();
                console.log("%c DỪNG LẠI", "color: red; font-size: 60px; font-weight: bold; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;");
                console.log("%c Cố tình can thiệp hệ thống sẽ bị block IP vĩnh viễn.", "color: yellow; font-size: 20px; font-family: monospace;");
            }, 100);
        };

        const khoitaohethong = function() {
            vohieuhoapham();
            baykiemtraloi();
            xoadulieubangdieukhien();
        };

        khoitaohethong();
    </script>
</body>
</html>
